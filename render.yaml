services:
  - type: web
    name: satoshi-hunt-api-beta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SATOSHI_HUNT_ENV
        value: beta
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHALLENGE_INGESTION_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: ASSIGNMENT_TIMEOUT_SECONDS
        value: "120"
      - key: MAX_ACTIVE_ASSIGNMENTS
        value: "10"
      - key: MAX_ACTIVE_ASSIGNMENTS_PER_JOB
        value: "1"
      - key: MAX_NETWORK_WORKER_HOURS_PER_DAY
        value: "100"
