name: staging-e2e
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: staging-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satoshi_hunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d satoshi_hunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Initialize staging database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          SATOSHI_HUNT_ENV: staging
        run: python tools/init_db.py
      - name: Backup and restore drill
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          BACKUP_DIR: /tmp/satoshi-backup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          sh tools/backup_db.sh
          backup_file=$(ls -1 /tmp/satoshi-backup/*.dump | tail -n 1)
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres satoshi_hunt_restore
          PGUSER=postgres pg_restore --clean --if-exists --no-owner \
            --dbname=postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt_restore "$backup_file"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d satoshi_hunt_restore -v ON_ERROR_STOP=1             -c "select count(*) > 0 as restore_has_schema from information_schema.tables where table_schema='public'"

      - name: Start API
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          JWT_SECRET: staging-e2e-secret
          SATOSHI_HUNT_ENV: staging
          RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
          OWNER_EMAIL: owner@example.com
          PAYOUT_WORKER_TOKEN: staging-payout-worker-token
        run: |
          uvicorn backend.api:app --host 127.0.0.1 --port 8000 >/tmp/satoshi-hunt-api.log 2>&1 &
          python -c "import time,urllib.request; time.sleep(3); urllib.request.urlopen('http://127.0.0.1:8000/health')"
      - name: Full staging flow
        env:
          SATOSHI_HUNT_API: http://127.0.0.1:8000
        run: python tools/staging_e2e.py

      - name: Concurrent assignment race gate
        env:
          SATOSHI_HUNT_API: http://127.0.0.1:8000
        run: python tools/staging_concurrency.py
      - name: Start mock payout executor
        env:
          MOCK_PAYOUT_TX_PREFIX: aaaaaaaaaaaaaaaa
        run: |
          python tools/mock_payout_executor.py >/tmp/mock-payout.log 2>&1 &
          sleep 1
      - name: Run payout worker against mock executor
        env:
          SATOSHI_HUNT_API: http://127.0.0.1:8000
          PAYOUT_WORKER_TOKEN: staging-payout-worker-token
          PAYOUT_EXECUTOR_URL: http://127.0.0.1:8765
          PAYOUT_EXECUTOR_TOKEN: staging-mock-token
          PAYOUT_POLL_SECONDS: "1"
        run: timeout 20s python tools/payout_worker.py || test $? -eq 124
      - name: Verify payout reached PAID
        env:
          SATOSHI_HUNT_API: http://127.0.0.1:8000
          STAGING_OWNER_EMAIL: owner@example.com
          STAGING_OWNER_PASSWORD: Staging-Owner-Only-2026!
          MOCK_PAYOUT_TX_PREFIX: aaaaaaaaaaaaaaaa
        run: python tools/staging_payout_verify.py

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-api-log-${{ github.run_id }}
          path: |
            /tmp/satoshi-hunt-api.log
            /tmp/mock-payout.log
          if-no-files-found: warn
