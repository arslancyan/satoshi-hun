name: production-deployment-gate
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: satoshi-hunt-production-health
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://satoshi-hunt-api-production.up.railway.app
    steps:
      - name: Verify production health
        env:
          API: https://satoshi-hunt-api-production.up.railway.app
        run: |
          for i in {1..30}; do
            if curl -fsS "$API/health" >/tmp/health.json; then
              cat /tmp/health.json
              curl -fsS "$API/ready"
              echo
              echo "Production health gate passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health gate timed out."
          exit 1
