name: production-deployment-gate
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: satoshi-hunt-production
  cancel-in-progress: true

jobs:
  verify-production-deployment:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://satoshi-hunt-api-production.up.railway.app
    steps:
      - name: Require Railway deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not configured for the production environment."
            exit 1
          fi
          echo "Railway deployment credential is configured."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Verify Railway project access
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway whoami

      - name: Verify production service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway status
          echo "Production deployment gate reached successfully."
