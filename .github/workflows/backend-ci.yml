name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satoshi_hunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d satoshi_hunt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt_test
      JWT_SECRET: ci-test-secret
      FRONTEND_ORIGIN: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/api.py backend/../audit.py backend/../protocol.py backend/../verifier.py challenge_adapters.py challenge_adapter_audit.py challenge_discovery.py registry.py worker.py

      - name: Audit challenge registry
        run: python audit.py puzzles.json

      - name: Audit challenge adapters
        run: python challenge_adapter_audit.py puzzles.json

      - name: Audit challenge discovery module
        run: python -m py_compile challenge_discovery.py

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Materialize runtime API for contract tests
        run: DATABASE_URL="" SATOSHI_HUNT_API_PATH="$GITHUB_WORKSPACE/backend/api.py" python tools/runtime_patch.py

      - name: Run integrity and PostgreSQL integration tests
        run: python -m pytest -q

      - name: Validate demo registry JSON
        run: python -m json.tool puzzles.json > /dev/null

      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt

      - name: Static security scan
        run: |
          python -m pip install bandit
          bandit -q -r backend worker.py verifier.py protocol.py audit.py
