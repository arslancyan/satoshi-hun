name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/api.py backend/../audit.py backend/../protocol.py backend/../verifier.py registry.py worker.py

      - name: Audit challenge registry
        run: python audit.py puzzles.json

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run integrity tests
        run: python -m pytest -q

      - name: Validate demo registry JSON
        run: python -m json.tool puzzles.json > /dev/null

      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt

      - name: Static security scan
        run: |
          python -m pip install bandit
          bandit -q -r backend worker.py verifier.py protocol.py audit.py
