name: production-smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Run production API smoke checks
        env:
          SATOSHI_HUNT_API: https://satoshi-hunt-api-production.up.railway.app
          SATOSHI_HUNT_FRONTEND_ORIGIN: https://arslancyan.github.io
          SATOSHI_HUNT_EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: python3 tools/production_smoke.py
