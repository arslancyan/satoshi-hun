name: live-challenge-sync

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Sync live public challenges
        env:
          DATABASE_URL: ${{ secrets.SATOSHI_HUNT_DATABASE_URL }}
          BITCOIN_EXPLORER_BASE: https://blockstream.info/api
          MEMPOOL_EXPLORER_BASE: https://mempool.space/api
          PUBLIC_CHALLENGE_SOURCE_URL: https://raw.githubusercontent.com/floflo777/open-crypto-puzzles/main/puzzles.json
          AUTHORITATIVE_ESCROW_SPEND_SLUGS: peter-todd-hash-collision-bounties-0-59btc
          CHALLENGE_ID_ALIASES: peter-todd-hash-collision-bounties-0-59btc:peter-todd-hash-collision-bounties
        run: python live_source_worker.py
