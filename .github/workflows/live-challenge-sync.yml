name: live-challenge-sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate live source and production sync surface
        env:
          PUBLIC_CHALLENGE_SOURCE_URL: https://raw.githubusercontent.com/floflo777/open-crypto-puzzles/main/puzzles.json
          SATOSHI_HUNT_API: https://satoshi-hunt-api-production.up.railway.app
        run: |
          python - <<'PY'
          import json, os, urllib.request
          source = os.environ["PUBLIC_CHALLENGE_SOURCE_URL"]
          api = os.environ["SATOSHI_HUNT_API"]
          with urllib.request.urlopen(source, timeout=20) as r:
              data = json.load(r)
          assert isinstance(data, (list, dict)), "public challenge source is not JSON"
          with urllib.request.urlopen(api + "/health", timeout=20) as r:
              health = json.load(r)
          assert health.get("status") == "ok", f"production health failed: {health}"
          print("LIVE_SOURCE_VALIDATION=PASS")
          print("PUBLIC_CHALLENGES_TYPE=", type(data).__name__)
          print("PRODUCTION_HEALTH=PASS")
          PY
