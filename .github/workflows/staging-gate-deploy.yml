name: staging-gate-and-railway-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: satoshi-hunt-production-deploy
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satoshi_hunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d satoshi_hunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Initialize staging
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          SATOSHI_HUNT_ENV: staging
        run: python tools/init_db.py
      - name: Start API
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          JWT_SECRET: staging-e2e-secret
          SATOSHI_HUNT_ENV: staging
          RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
          OWNER_EMAIL: owner@example.com
        run: |
          uvicorn backend.api:app --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - name: Full settlement E2E
        env:
          SATOSHI_HUNT_API: http://127.0.0.1:8000
        run: python tools/staging_e2e.py

  deploy:
    needs: staging
    if: ${{ success() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://satoshi-hunt-api-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API after staging gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not configured; production deployment cannot be verified."
            exit 1
          fi
          npm install -g @railway/cli
          railway up --service satoshi-hunt-api --environment production
