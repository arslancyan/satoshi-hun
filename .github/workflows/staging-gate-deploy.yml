name: staging-gate-and-railway-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: satoshi-hunt-production-deploy
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: satoshi_hunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d satoshi_hunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Initialize staging
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          SATOSHI_HUNT_ENV: staging
        run: python tools/init_db.py
      - name: Start API
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/satoshi_hunt
          JWT_SECRET: staging-e2e-secret
          SATOSHI_HUNT_ENV: staging
          RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
          OWNER_EMAIL: owner@example.com
        run: |
          uvicorn backend.api:app --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - name: Full settlement E2E
        env:
          SATOSHI_HUNT_API: http://127.0.0.1:8000
        run: python tools/staging_e2e.py

  deploy:
    needs: staging
    if: ${{ success() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://satoshi-hunt-api-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Railway production
        env:
          API: https://satoshi-hunt-api-production.up.railway.app
        run: |
          DEPLOY_RELEVANT=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^(backend/|Dockerfile|railway\.json|railway\.toml|requirements\.txt)' || true)
          for i in {1..30}; do
            if curl -fsS "$API/health" >/tmp/health.json; then
              cat /tmp/health.json
              if [ -z "$DEPLOY_RELEVANT" ]; then
                echo "No production-backend files changed; healthy production is sufficient."
                exit 0
              fi
              ACTUAL_COMMIT=$(python3 -c 'import json; print(json.load(open("/tmp/health.json")).get("commit",""))')
              if [ "$ACTUAL_COMMIT" = "$GITHUB_SHA" ]; then
                echo "Production API is serving the expected backend commit."
                exit 0
              fi
              echo "Production is healthy but still serving $ACTUAL_COMMIT; waiting for $GITHUB_SHA."
            fi
            sleep 10
          done
          echo "::error::Production API did not reach the expected deployment state after staging passed."
          exit 1
