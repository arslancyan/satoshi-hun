<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satoshi Hunt — Account</title><style>body{margin:0;background:#080b12;color:#e9eef7;font-family:system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:35px}.card{background:#101722;border:1px solid #1b2636;border-radius:16px;padding:22px;margin:14px 0}input{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;background:#0b1018;border:1px solid #263449;border-radius:9px;color:white}.btn{padding:11px 15px;margin:8px 5px 0 0;border:1px solid #55d6ff;background:#102536;color:#dff7ff;border-radius:9px;font-weight:800;cursor:pointer}.muted{color:#8190a4;font-size:12px}.ok{color:#63e6aa}.err{color:#ff8b8b}a{color:#55d6ff}</style></head><body><main class="wrap"><h1>SATOSHI HUNT</h1><div class="muted">Production account · Railway API</div><section class="card"><h2>Register / Login</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (12+ characters)"><button class="btn" onclick="auth('/auth/register')">REGISTER</button><button class="btn" onclick="auth('/auth/login')">LOGIN</button><div id="msg"></div></section><section class="card"><h2>BTC payout wallet</h2><input id="wallet" placeholder="bc1..."><button class="btn" onclick="saveWallet()">SAVE WALLET</button><div id="me" class="muted"></div></section><section class="card"><a href="marketplace.html">Open Live Marketplace →</a></section></main><script>const API="https://satoshi-hunt-api-production.up.railway.app";const msg=x=>document.getElementById("msg").innerHTML=x;async function auth(path){try{const email=document.getElementById("email").value,password=document.getElementById("password").value;const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Request failed");localStorage.setItem("satoshi_hunt_session",d.session);msg('<p class="ok">Authenticated.</p>');await loadMe()}catch(e){msg('<p class="err">'+e.message+"</p>")}}async function loadMe(){const t=localStorage.getItem("satoshi_hunt_session");if(!t)return;const r=await fetch(API+"/me",{headers:{Authorization:"Bearer "+t}});const d=await r.json();if(r.ok){document.getElementById("wallet").value=d.btc_payout_address||"";document.getElementById("me").textContent="Logged in as "+d.email}}async function saveWallet(){try{const t=localStorage.getItem("satoshi_hunt_session");if(!t)return msg('<p class="err">Login first.</p>');const wallet=document.getElementById("wallet").value.trim();const r=await fetch(API+"/account/payout-address",{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+t,"Idempotency-Key":"wallet-"+Date.now()},body:JSON.stringify({btc_payout_address:wallet})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Wallet update failed");msg('<p class="ok">BTC payout address saved and validated.</p>')}catch(e){msg('<p class="err">'+e.message+"</p>")}}loadMe();</script></body></html>
